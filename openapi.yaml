openapi: 3.0.3

info:
  title: Life Tracker API
  version: 0.6.0
  description: |
    The wire contract for Life Tracker. This document is the SINGLE source of truth for the
    shape of every request and response. Frontends generate their clients from it and never
    hand-write a request or response type; the backend generates nothing but must match it.

    This document covers **Identity & Sharing** (registration, login, tokens, sessions, and the
    management of how a Book is shared) AND the first slice of the **Ledger** — accounts, and
    recording transactions as balanced movements. Still to come: balance-based reporting (net worth,
    spending, income), cross-currency transactions, splits and metadata, and the read endpoints a
    viewer calls. If you need a Ledger field that isn't here, STOP and design it — do not invent one.

    ## Conventions
    - **Money crosses the wire as a string**: `{ "amount": "12.34", "currency": "USD" }`. A JSON
      number is an IEEE 754 double in JavaScript and is corrupted before any client reads it.
      No money fields appear in this identity slice, but the rule holds the moment the Ledger
      surface lands.
    - **Time** is RFC 3339 / ISO 8601 UTC (`format: date-time`).
    - **Errors** use RFC 7807 `application/problem+json` (see `Problem`).
    - **Ids** are UUIDs unless noted.

servers:
  - url: https://api.lifetracker.example/v1
    description: Placeholder — the real host lands with deployment.

tags:
  - name: auth
    description: Registration, login, token refresh, logout.
  - name: sessions
    description: A User's active logins (one per device); listing and revoking them.
  - name: me
    description: The authenticated User and the sharing of their own Book.
  - name: sharing
    description: Opening a Book to viewers — the anonymous Share Link and named View Grants.
  - name: accounts
    description: The Ledger's accounts — where balances live, each with a kind and a fixed currency.
  - name: transactions
    description: Recording money movement as balanced double-entry postings.
  - name: reports
    description: Computed-on-demand views — net worth, spending, income. Per currency.

# Every operation requires a valid access token UNLESS it overrides this with `security: []`.
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new User (open self-serve signup)
      description: |
        Creates a User and their (empty) Book, then AUTO-LOGS-IN: opens a Session and returns an
        access token plus a refresh token, exactly like `/auth/login`, AND sends an email
        verification link. Open to anyone. The User is signed in immediately whether or not they
        verify; verification gates only certain actions (today, sharing — see `403
        EMAIL_NOT_VERIFIED` on the sharing endpoints), never whether they are signed in. Both tokens
        are returned in the body, as by `/auth/login`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created and signed in — Session opened, both tokens returned in the body (same shape as login).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409':
          description: That email already belongs to a User.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Email malformed or password fails policy.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and open a Session
      description: |
        Verifies the password and, on success, opens a new **Session** (one login lineage,
        one device) and issues a short-lived access token plus a rotating refresh token.

        **Token delivery (v1):** both `accessToken` and `refreshToken` are returned in the JSON
        body, uniformly for every client, which stores them itself. `accessToken` is sent back
        as `Authorization: Bearer <token>`; `refreshToken` is presented to `/auth/refresh`.

        > PRE-PRODUCTION HARDENING: keeping the refresh token in JS-reachable storage on web is
        > an XSS exposure. Before the web client faces real users, move browser/Electron refresh
        > delivery to an httpOnly, Secure, SameSite cookie (native clients keep the body). That
        > is a deliberate future spec change, tracked in the README.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Session opened; both tokens returned in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Email unknown or password wrong. Deliberately indistinguishable (no user enumeration).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Too many failed attempts for this email — a temporary lockout (brute-force protection).
            Counted per email whether or not it is registered, so a lockout never reveals which
            emails exist. Code `TOO_MANY_ATTEMPTS`.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying, until the lockout window drains.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and mint a fresh access token
      description: |
        Single-use rotation: consumes the presented refresh token, issues a NEW access token
        and a NEW refresh token, and advances the Session. If a token that was already rotated
        away is presented (theft signal), the whole Session is revoked and this returns 401.

        The refresh token is sent in the body (`refreshToken`). It is NOT the access bearer
        token.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated. New access token and new refresh token in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Refresh token missing, expired, unknown, or replayed (Session revoked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current Session
      description: Revokes the Session behind the presented access token. The client discards its stored tokens.
      operationId: logout
      responses:
        '204':
          description: Current Session ended.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify an email address with the link's token
      description: |
        Consumes a single-use verification token (from the link emailed at registration or resend)
        and marks the email verified. Public — the token is the credential. Single-use and expiring
        (~24h); a bad, expired, or already-used token is `400 INVALID_TOKEN`.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204':
          description: Email verified.
        '400':
          description: Token missing, malformed, expired, or already used. Code `INVALID_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Resend the verification email to the signed-in User
      description: |
        Issues a fresh verification token for the authenticated User and sends it, invalidating any
        previous one. A no-op (still `202`) if the email is already verified. Authenticated and
        scoped to the caller, so it cannot be used to probe other addresses.
      operationId: resendEmailVerification
      responses:
        '202':
          description: A verification email has been sent (or the email was already verified).
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Request a password-reset link
      description: |
        If a User owns this email, a single-use reset token (~1h) is emailed, invalidating any prior
        one. Public, and DELIBERATELY non-enumerating: the response is always `202` whether or not
        the email is registered, so it never reveals who has an account.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: If the email belongs to a User, a reset link has been sent. Returned either way.

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Consumes a single-use reset token and sets a new password. Public — the token is the
        credential. On success EVERY Session is revoked (a reset answers a possible takeover), so all
        clients must sign in again. A bad/expired/used token is `400 INVALID_TOKEN`; a password that
        fails policy is `422`.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204':
          description: Password changed; all Sessions revoked.
        '400':
          description: Token missing, malformed, expired, or already used. Code `INVALID_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The new password fails policy.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sessions:
    get:
      tags: [sessions]
      summary: List the User's active Sessions (the "active devices" screen)
      operationId: listSessions
      responses:
        '200':
          description: The caller's active Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [sessions]
      summary: Sign out everywhere
      description: Revokes ALL of the caller's Sessions, including the current one.
      operationId: revokeAllSessions
      responses:
        '204':
          description: All Sessions revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      summary: Revoke one Session (remote logout of a device)
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such Session belonging to the caller.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [me]
      summary: The authenticated User
      operationId: getMe
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/share-link:
    get:
      tags: [sharing]
      summary: Get the active Share Link for my Book
      description: The single anonymous "anyone with the link can view" URL, if sharing is on.
      operationId: getShareLink
      responses:
        '200':
          description: The active Share Link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '404':
          description: Link sharing is off for this Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [sharing]
      summary: Turn on link sharing (mint the Share Link)
      description: |
        Mints the single Share Link for the caller's Book. If one is already active, returns
        it (409 is not used — turning on an already-on switch is a no-op that yields the link).
        To rotate, DELETE then POST — a fresh, unguessable token is minted and the old URL
        stays dead forever.
      operationId: createShareLink
      responses:
        '200':
          description: Sharing already on; the existing link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '201':
          description: Sharing turned on; a new link minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The owner's email is not verified. Code `EMAIL_NOT_VERIFIED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [sharing]
      summary: Revoke the Share Link (turn link sharing off)
      description: Burns the token permanently. Anyone still holding the URL gets nothing. Re-enabling mints a new one.
      operationId: revokeShareLink
      responses:
        '204':
          description: Link revoked (or already off).
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/view-grants:
    get:
      tags: [sharing]
      summary: List the View Grants I have extended
      operationId: listViewGrants
      responses:
        '200':
          description: Named people who may read my Book.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ViewGrant' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [sharing]
      summary: Grant a named User read access to my Book
      description: |
        The grantee must ALREADY be a registered User (email-based invites are deferred). If
        the email belongs to no User, this returns 404 — "ask them to sign up first".
      operationId: createViewGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateViewGrantRequest' }
      responses:
        '201':
          description: Grant created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewGrant' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No registered User owns that email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: That User already holds a grant on this Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The email is malformed, or the caller tried to share with themselves.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The owner's email is not verified. Code `EMAIL_NOT_VERIFIED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/view-grants/{grantId}:
    delete:
      tags: [sharing]
      summary: Revoke a View Grant
      operationId: revokeViewGrant
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Grant revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such grant on the caller's Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /accounts:
    post:
      tags: [accounts]
      summary: Create an account
      description: |
        Creates an account in the caller's Book. An account has a **kind** (which fixes its
        debit/credit behaviour and reporting role — ADR-0001) and a **fixed currency** every posting
        to it must match (ADR-0002). Accounts exist only where a reconcilable balance lives (a bank,
        a card, a friend's IOU); a shop you pay on the spot is metadata, never an account (ADR-0003).
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Name, kind, or currency is invalid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [accounts]
      summary: List the caller's accounts, each with its current balance
      operationId: listAccounts
      responses:
        '200':
          description: The caller's accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /accounts/{accountId}:
    get:
      tags: [accounts]
      summary: Get one account with its current balance
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such account in the caller's Book. Code `ACCOUNT_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /transactions:
    post:
      tags: [transactions]
      summary: Record a transaction as a movement between two accounts
      description: |
        Records money moving from one account to another as a balanced double-entry transaction: the
        `from` account is credited and the `to` account debited, and the account kinds make the result
        correct without the caller thinking in debits and credits (ADR-0012). `from` and `to` must
        differ (`SAME_ACCOUNT`).

        Same-currency: send `amount` in the shared currency. Cross-currency: send `amount` (leaving
        `from`) and `toAmount` (arriving in `to`), each in its account's currency; the exchange rate
        is derived from the two and never multiplied to make an amount (ADR-0002). A cross-currency
        movement missing `toAmount` is `CONVERTED_AMOUNT_REQUIRED`; each posting's amount must be in
        its account's currency.

        An opening balance is simply a movement from an Equity account into the new account (ADR-0004).
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordTransactionRequest' }
      responses:
        '201':
          description: Transaction recorded; its balanced postings are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A referenced account does not exist (`ACCOUNT_NOT_FOUND`), the two accounts are the same
            (`SAME_ACCOUNT`), a cross-currency movement is missing `toAmount`
            (`CONVERTED_AMOUNT_REQUIRED`), or an amount is malformed, negative, or in the wrong
            currency (`VALIDATION`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [transactions]
      summary: List the caller's transactions, newest first
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          required: false
          description: If given, only transactions with a posting to this account.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The caller's transactions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /transactions/{transactionId}:
    get:
      tags: [transactions]
      summary: Get one transaction
      operationId: getTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such transaction in the caller's Book. Code `TRANSACTION_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/net-worth:
    get:
      tags: [reports]
      summary: Net worth — Assets minus Liabilities, per currency
      description: |
        Computed on demand (ADR-0004): for each currency, total Asset balances minus total Liability
        balances. Money owed TO you is an Asset (a Receivable) so it adds; money you owe is a Liability
        (a Payable) so it subtracts. Valuing across currencies into one figure is out of scope
        (ADR-0002), so the result is broken down per currency.
      operationId: getNetWorth
      responses:
        '200':
          description: Net worth per currency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetWorthReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/spending:
    get:
      tags: [reports]
      summary: Spending over a date range — Expense-account activity, per account and currency
      description: |
        Sums Expense-account movement over the range (ADR-0004). Transfers, lends, and repayments never
        touch an Expense account, so they are excluded by construction (ADR-0001) — this is only real
        spending. Broken down per Expense account, totalled per currency. Omit the range for all-time.
      operationId: getSpending
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date (ISO 8601). Omit for no lower bound.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive end date (ISO 8601). Omit for no upper bound.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Spending in the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/income:
    get:
      tags: [reports]
      summary: Income over a date range — Income-account activity, per account and currency
      description: |
        Sums Income-account movement over the range (ADR-0004). Like spending, transfers and repayments
        are excluded by construction. Broken down per Income account, totalled per currency. Omit the
        range for all-time.
      operationId: getIncome
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date (ISO 8601). Omit for no lower bound.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive end date (ISO 8601). Omit for no upper bound.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Income in the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: JSON Web Key Set — the RS256 public key(s) for verifying access tokens
      description: |
        The public key(s) a resource server uses to verify access-token signatures, so no shared
        secret is needed. Public — no authentication. Each key's `kid` matches the `kid` in an
        access token's JWS header.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: The active signing key(s) as a JWKS (RFC 7517).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The short-lived RS256 access token from `/auth/login` or `/auth/refresh`. Validated by
        signature against the JWKS public key; the backend never calls a session store on the
        read path. The refresh token is a separate credential (sent in the body to
        `/auth/refresh`) and is NOT sent here.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Minimum length is provisional; the full policy is a follow-on decision.
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        deviceLabel:
          type: string
          maxLength: 200
          description: |
            Optional label for the Session on the "active devices" screen, e.g. "Pixel 8" or
            "Chrome on Mac". If omitted, the server falls back to the User-Agent. Truncated to 200.
      additionalProperties: false

    RefreshRequest:
      type: object
      required: [refreshToken]
      description: The refresh token to rotate, as returned by login / register / refresh.
      properties:
        refreshToken: { type: string }
      additionalProperties: false

    VerifyEmailRequest:
      type: object
      required: [token]
      description: The single-use verification token from the emailed link.
      properties:
        token: { type: string }
      additionalProperties: false

    PasswordResetRequest:
      type: object
      required: [email]
      description: The email to send a reset link to, if it belongs to a User.
      properties:
        email: { type: string, format: email }
      additionalProperties: false

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The single-use reset token from the emailed link.
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Same policy as registration.
      additionalProperties: false

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken]
      properties:
        accessToken: { type: string, description: RS256 JWT. }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access-token lifetime in seconds (~900). }
        refreshToken:
          type: string
          description: Opaque rotating refresh token. Returned in the body for every client in v1 (see the pre-production hardening note on /auth/login).
      additionalProperties: false

    User:
      type: object
      required: [id, email, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified:
          type: boolean
          description: Whether the User has verified their email. Unverified Users are signed in but cannot share (see the sharing endpoints' 403).
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Session:
      type: object
      required: [id, createdAt, lastActiveAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean, description: True for the Session making this request. }
      additionalProperties: false

    ShareLink:
      type: object
      required: [url, createdAt]
      properties:
        url:
          type: string
          format: uri
          description: The full "anyone with the link" URL, carrying the unguessable token. Re-copyable while active.
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    CreateViewGrantRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Must belong to an already-registered User.
      additionalProperties: false

    ViewGrant:
      type: object
      required: [id, granteeEmail, granteeUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        granteeEmail: { type: string, format: email }
        granteeUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Jwks:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            description: A JSON Web Key — here an RSA public key (kty=RSA), whose kid matches the token header.
            properties:
              kty: { type: string }
              kid: { type: string }
              alg: { type: string }
              use: { type: string }
              n: { type: string, description: RSA modulus, base64url. }
              e: { type: string, description: RSA exponent, base64url. }

    Money:
      type: object
      description: |
        A monetary amount as a decimal STRING (never a JSON number — a double corrupts it before any
        client reads it) plus an ISO 4217 currency. Posting amounts are non-negative; a balance may
        be negative.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal, up to 4 fractional digits, e.g. "12.34". A balance may be negative, e.g. "-5.00".
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code, e.g. "USD".
      additionalProperties: false

    AccountKind:
      type: string
      description: |
        Fixes the debit/credit normal side and reporting role (ADR-0001). Asset & Expense grow on
        debit; Liability, Income, Equity grow on credit. Net worth = Assets − Liabilities; spending =
        Expense totals; earning = Income totals; Equity is opening capital only.
      enum: [ASSET, LIABILITY, INCOME, EXPENSE, EQUITY]

    CreateAccountRequest:
      type: object
      required: [name, kind, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/AccountKind' }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; every posting to this account is in this currency.
      additionalProperties: false

    Account:
      type: object
      required: [id, name, kind, currency, balance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountKind' }
        currency: { type: string, description: ISO 4217 code. }
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Current balance, computed from postings (ADR-0004). Signed — may be negative.
      additionalProperties: false

    Posting:
      type: object
      description: One leg of a transaction — a debit or credit of a non-negative amount to an account.
      required: [accountId, direction, amount]
      properties:
        accountId: { type: string, format: uuid }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    RecordTransactionRequest:
      type: object
      description: |
        A movement — money out of `from` (credited), into `to` (debited). Same-currency: `amount`
        alone. Cross-currency: `amount` is the real figure leaving `from` and `toAmount` the real
        figure arriving in `to`, each in its account's currency (ADR-0002).
      required: [date, from, to, amount]
      properties:
        date:
          type: string
          format: date
          description: The calendar date of the transaction (a precise timestamp is metadata, ADR-0003).
        from:
          type: string
          format: uuid
          description: The account money leaves (credited).
        to:
          type: string
          format: uuid
          description: The account money arrives in (debited).
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The amount leaving `from`, in `from`'s currency.
        toAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            The amount arriving in `to`, in `to`'s currency. Required when the two accounts differ in
            currency; omit it (or match `amount`) when they share one.
      additionalProperties: false

    Transaction:
      type: object
      description: A recorded transaction, as its balanced postings (the ledger truth, ADR-0012).
      required: [id, date, postings]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        exchangeRate:
          type: string
          nullable: true
          description: |
            For a cross-currency transaction, the rate derived from the two legs (to-amount ÷
            from-amount), a decimal string for reference only — never multiplied to make an amount
            (ADR-0002). Null for a same-currency transaction.
        postings:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Posting' }
      additionalProperties: false

    CurrencyNetWorth:
      type: object
      required: [currency, assets, liabilities, netWorth]
      properties:
        currency: { type: string, description: ISO 4217 code. }
        assets:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Total of Asset account balances in this currency.
        liabilities:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Total of Liability account balances in this currency.
        netWorth:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: assets − liabilities (signed).
      additionalProperties: false

    NetWorthReport:
      type: object
      required: [byCurrency]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyNetWorth' }
      additionalProperties: false

    AccountAmount:
      type: object
      required: [accountId, name, currency, amount]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, description: ISO 4217 code. }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    CurrencyAmount:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, description: ISO 4217 code. }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    ActivityReport:
      type: object
      description: Spending or income over a date range — per account, and totalled per currency.
      required: [byAccount, totals]
      properties:
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        byAccount:
          type: array
          items: { $ref: '#/components/schemas/AccountAmount' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/CurrencyAmount' }
      additionalProperties: false

    Problem:
      type: object
      description: RFC 7807 problem detail.
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable code for the specific error. One of: UNAUTHORIZED,
            TOO_MANY_ATTEMPTS, EMAIL_TAKEN, VALIDATION, INVALID_TOKEN, EMAIL_NOT_VERIFIED,
            SESSION_NOT_FOUND, GRANTEE_NOT_FOUND, VIEW_GRANT_EXISTS, VIEW_GRANT_NOT_FOUND,
            CANNOT_SHARE_WITH_SELF, SHARE_LINK_NOT_FOUND, ACCOUNT_NOT_FOUND, TRANSACTION_NOT_FOUND,
            SAME_ACCOUNT, CONVERTED_AMOUNT_REQUIRED.
      additionalProperties: false
