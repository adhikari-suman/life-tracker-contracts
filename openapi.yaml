openapi: 3.0.3

info:
  title: Life Tracker API
  version: 0.8.1
  description: |
    The wire contract for Life Tracker. This document is the SINGLE source of truth for the
    shape of every request and response. Frontends generate their clients from it and never
    hand-write a request or response type; the backend generates nothing but must match it.

    This document covers **Identity & Sharing** (registration, login, tokens, sessions, and the
    management of how a Book is shared) AND the **Ledger** — accounts, transactions recorded as
    balanced movements (same- and cross-currency), reporting (net worth, spending, income), and
    **labels**, the categorization of what money was for. Still to come: splits (several labelled
    legs under one transaction), the rest of the metadata (merchant, branch), and the read endpoints
    a viewer calls. If you need a Ledger field that isn't here, STOP and design it — do not invent one.

    ## Conventions
    - **Money crosses the wire as a string**: `{ "amount": "12.34", "currency": "USD" }`. A JSON
      number is an IEEE 754 double in JavaScript and is corrupted before any client reads it.
      No money fields appear in this identity slice, but the rule holds the moment the Ledger
      surface lands.
    - **Instants** are RFC 3339 / ISO 8601 UTC (`format: date-time`) — `createdAt`, `lastActiveAt`
      and every other moment the SYSTEM observed.
    - **A transaction's own date and time are not instants** and must not be treated as ones. They
      are a wall-clock reading supplied by the person recording it: `date` plus a zoneless `HH:mm`
      `time` (ADR-0018). Converting either into UTC would let a late-evening purchase drift into
      the next day and change which month it reports in. The distinction has names in the domain
      glossary — *Occurred At* for these, *Recorded At* for the instant beside them.
    - **Errors** use RFC 7807 `application/problem+json` (see `Problem`).
    - **Ids** are UUIDs unless noted.
    - **Request bodies are strict** (`additionalProperties: false`, everywhere). A body that does not
      match its schema — malformed JSON, or a field the schema does not declare — is rejected with
      `400 MALFORMED_REQUEST`, never silently accepted with the stray field dropped. A typo'd field
      name is an error, not a no-op. This is a blanket rule, so the per-operation responses below do
      not each repeat the 400.
    - **A body that PARSES but is invalid is `422 VALIDATION`.** The 400 above is for a body that
      cannot be read as written; one that reads cleanly and only then fails its schema — a missing
      `required` field, a value outside its declared `pattern`, `minLength` or `enum` — is `422`
      with code `VALIDATION`. The dividing line is whether the body could be understood at all.
      Also a blanket rule, so the per-operation responses do not repeat it either; where an
      operation documents a MORE specific 422 code (`SAME_ACCOUNT`, `CONVERTED_AMOUNT_REQUIRED`,
      `LABEL_NOT_APPLICABLE`, `LABEL_ARCHIVED`), that code wins over the generic one.

      Neither case is ever a `5xx`. A required field arriving absent is the client's error and must
      be answered as one; if it reaches far enough in to throw, that is a bug in the server, not a
      shape the contract permits.

servers:
  - url: https://api.lifetracker.example/v1
    description: Placeholder — the real host lands with deployment.

tags:
  - name: auth
    description: Registration, login, token refresh, logout.
  - name: sessions
    description: A User's active logins (one per device); listing and revoking them.
  - name: me
    description: The authenticated User and the sharing of their own Book.
  - name: sharing
    description: Opening a Book to viewers — the anonymous Share Link and named View Grants.
  - name: accounts
    description: The Ledger's accounts — where balances live, each with a kind and a fixed currency.
  - name: transactions
    description: Recording money movement as balanced double-entry postings.
  - name: labels
    description: |
      The categorization tree — what money was FOR. Labels are metadata attached to a posting
      (ADR-0014), never part of the double-entry core, and say nothing about what KIND of
      transaction something is.
  - name: reports
    description: Computed-on-demand views — net worth, spending, income. Per currency.

# Every operation requires a valid access token UNLESS it overrides this with `security: []`.
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new User (open self-serve signup)
      description: |
        Creates a User and their (empty) Book, then AUTO-LOGS-IN: opens a Session and returns an
        access token plus a refresh token, exactly like `/auth/login`, AND sends an email
        verification link. Open to anyone. The User is signed in immediately whether or not they
        verify; verification gates only certain actions (today, sharing — see `403
        EMAIL_NOT_VERIFIED` on the sharing endpoints), never whether they are signed in. Both tokens
        are returned in the body, as by `/auth/login`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created and signed in — Session opened, both tokens returned in the body (same shape as login).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409':
          description: That email already belongs to a User.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Email malformed or password fails policy.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and open a Session
      description: |
        Verifies the password and, on success, opens a new **Session** (one login lineage,
        one device) and issues a short-lived access token plus a rotating refresh token.

        **Token delivery (v1):** both `accessToken` and `refreshToken` are returned in the JSON
        body, uniformly for every client, which stores them itself. `accessToken` is sent back
        as `Authorization: Bearer <token>`; `refreshToken` is presented to `/auth/refresh`.

        > PRE-PRODUCTION HARDENING: keeping the refresh token in JS-reachable storage on web is
        > an XSS exposure. Before the web client faces real users, move browser/Electron refresh
        > delivery to an httpOnly, Secure, SameSite cookie (native clients keep the body). That
        > is a deliberate future spec change, tracked in the README.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Session opened; both tokens returned in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Email unknown or password wrong. Deliberately indistinguishable (no user enumeration).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Too many failed attempts for this email — a temporary lockout (brute-force protection).
            Counted per email whether or not it is registered, so a lockout never reveals which
            emails exist. Code `TOO_MANY_ATTEMPTS`.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying, until the lockout window drains.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and mint a fresh access token
      description: |
        Single-use rotation: consumes the presented refresh token, issues a NEW access token
        and a NEW refresh token, and advances the Session. If a token that was already rotated
        away is presented (theft signal), the whole Session is revoked and this returns 401.

        The refresh token is sent in the body (`refreshToken`). It is NOT the access bearer
        token.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated. New access token and new refresh token in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Refresh token missing, expired, unknown, or replayed (Session revoked).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current Session
      description: Revokes the Session behind the presented access token. The client discards its stored tokens.
      operationId: logout
      responses:
        '204':
          description: Current Session ended.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify an email address with the link's token
      description: |
        Consumes a single-use verification token (from the link emailed at registration or resend)
        and marks the email verified. Public — the token is the credential. Single-use and expiring
        (~24h); a bad, expired, or already-used token is `400 INVALID_TOKEN`.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204':
          description: Email verified.
        '400':
          description: Token missing, malformed, expired, or already used. Code `INVALID_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Resend the verification email to the signed-in User
      description: |
        Issues a fresh verification token for the authenticated User and sends it, invalidating any
        previous one. A no-op (still `202`) if the email is already verified. Authenticated and
        scoped to the caller, so it cannot be used to probe other addresses.
      operationId: resendEmailVerification
      responses:
        '202':
          description: A verification email has been sent (or the email was already verified).
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Request a password-reset link
      description: |
        If a User owns this email, a single-use reset token (~1h) is emailed, invalidating any prior
        one. Public, and DELIBERATELY non-enumerating: the response is always `202` whether or not
        the email is registered, so it never reveals who has an account.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: If the email belongs to a User, a reset link has been sent. Returned either way.

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Consumes a single-use reset token and sets a new password. Public — the token is the
        credential. On success EVERY Session is revoked (a reset answers a possible takeover), so all
        clients must sign in again. A bad/expired/used token is `400 INVALID_TOKEN`; a password that
        fails policy is `422`.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204':
          description: Password changed; all Sessions revoked.
        '400':
          description: Token missing, malformed, expired, or already used. Code `INVALID_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The new password fails policy.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sessions:
    get:
      tags: [sessions]
      summary: List the User's active Sessions (the "active devices" screen)
      operationId: listSessions
      responses:
        '200':
          description: The caller's active Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [sessions]
      summary: Sign out everywhere
      description: Revokes ALL of the caller's Sessions, including the current one.
      operationId: revokeAllSessions
      responses:
        '204':
          description: All Sessions revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      summary: Revoke one Session (remote logout of a device)
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such Session belonging to the caller.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [me]
      summary: The authenticated User
      operationId: getMe
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/share-link:
    get:
      tags: [sharing]
      summary: Get the active Share Link for my Book
      description: The single anonymous "anyone with the link can view" URL, if sharing is on.
      operationId: getShareLink
      responses:
        '200':
          description: The active Share Link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '404':
          description: Link sharing is off for this Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [sharing]
      summary: Turn on link sharing (mint the Share Link)
      description: |
        Mints the single Share Link for the caller's Book. If one is already active, returns
        it (409 is not used — turning on an already-on switch is a no-op that yields the link).
        To rotate, DELETE then POST — a fresh, unguessable token is minted and the old URL
        stays dead forever.
      operationId: createShareLink
      responses:
        '200':
          description: Sharing already on; the existing link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '201':
          description: Sharing turned on; a new link minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The owner's email is not verified. Code `EMAIL_NOT_VERIFIED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [sharing]
      summary: Revoke the Share Link (turn link sharing off)
      description: Burns the token permanently. Anyone still holding the URL gets nothing. Re-enabling mints a new one.
      operationId: revokeShareLink
      responses:
        '204':
          description: Link revoked (or already off).
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/view-grants:
    get:
      tags: [sharing]
      summary: List the View Grants I have extended
      operationId: listViewGrants
      responses:
        '200':
          description: Named people who may read my Book.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ViewGrant' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [sharing]
      summary: Grant a named User read access to my Book
      description: |
        The grantee must ALREADY be a registered User (email-based invites are deferred). If
        the email belongs to no User, this returns 404 — "ask them to sign up first".
      operationId: createViewGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateViewGrantRequest' }
      responses:
        '201':
          description: Grant created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewGrant' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No registered User owns that email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: That User already holds a grant on this Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The email is malformed, or the caller tried to share with themselves.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The owner's email is not verified. Code `EMAIL_NOT_VERIFIED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/view-grants/{grantId}:
    delete:
      tags: [sharing]
      summary: Revoke a View Grant
      operationId: revokeViewGrant
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Grant revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such grant on the caller's Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /accounts:
    post:
      tags: [accounts]
      summary: Create an account
      description: |
        Creates an account in the caller's Book. An account has a **kind** (which fixes its
        debit/credit behaviour and reporting role — ADR-0001) and a **fixed currency** every posting
        to it must match (ADR-0002). Accounts exist only where a reconcilable balance lives (a bank,
        a card, a friend's IOU); a shop you pay on the spot is metadata, never an account (ADR-0003).
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Name, kind, or currency is invalid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [accounts]
      summary: List the caller's accounts, each with its current balance
      operationId: listAccounts
      responses:
        '200':
          description: The caller's accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /accounts/{accountId}:
    get:
      tags: [accounts]
      summary: Get one account with its current balance
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such account in the caller's Book. Code `ACCOUNT_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /transactions:
    post:
      tags: [transactions]
      summary: Record a transaction as a movement between two accounts
      description: |
        Records money moving from one account to another as a balanced double-entry transaction: the
        `from` account is credited and the `to` account debited, and the account kinds make the result
        correct without the caller thinking in debits and credits (ADR-0012). `from` and `to` must
        differ (`SAME_ACCOUNT`).

        Same-currency: send `amount` in the shared currency. Cross-currency: send `amount` (leaving
        `from`) and `toAmount` (arriving in `to`), each in its account's currency; the exchange rate
        is derived from the two and never multiplied to make an amount (ADR-0002). A cross-currency
        movement missing `toAmount` is `CONVERTED_AMOUNT_REQUIRED`; each posting's amount must be in
        its account's currency.

        An opening balance is simply a movement from an Equity account into the new account (ADR-0004).
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordTransactionRequest' }
      responses:
        '201':
          description: Transaction recorded; its balanced postings are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: The referenced label does not exist in the caller's Book. Code `LABEL_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A referenced account does not exist (`ACCOUNT_NOT_FOUND`), the two accounts are the same
            (`SAME_ACCOUNT`), a cross-currency movement is missing `toAmount`
            (`CONVERTED_AMOUNT_REQUIRED`), an amount is malformed, negative, or in the wrong
            currency (`VALIDATION`), a `labelId` was sent for a movement that has no single Income or
            Expense leg to hold it (`LABEL_NOT_APPLICABLE` — either no such leg at all, or two of
            them and no way to tell which was meant), or the label is archived (`LABEL_ARCHIVED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [transactions]
      summary: List the caller's transactions, newest first
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          required: false
          description: If given, only transactions with a posting to this account.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The caller's transactions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /transactions/{transactionId}:
    get:
      tags: [transactions]
      summary: Get one transaction
      operationId: getTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such transaction in the caller's Book. Code `TRANSACTION_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /labels:
    post:
      tags: [labels]
      summary: Create a label
      description: |
        Creates a label in the caller's Book. A label says what money was **for** (`groceries`,
        `salary`) — never what KIND of transaction something is; "internal transfer", "opening
        balance" and "credit-card payment" are facts about the accounts a transaction touches, and
        deliberately are not labels (ADR-0014).

        Labels form a tree **at most three levels deep** with no cycles. Sibling names are unique
        case-insensitively, so `other` may live under both `food` and `transport`; the casing you
        send is preserved for display. Omit `parentId` to create a root.
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLabelRequest' }
      responses:
        '201':
          description: Label created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such parent label in the caller's Book. Code `LABEL_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A sibling already bears this name (`LABEL_NAME_TAKEN`), the parent already sits at the
            depth limit (`LABEL_DEPTH_EXCEEDED`), or the name is malformed (`VALIDATION`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [labels]
      summary: List the caller's labels, flat, with parent pointers
      description: |
        Every label in the caller's Book, flat — build the tree from `parentId`. A personal Book
        holds dozens of labels rather than thousands, so there is deliberately no search endpoint:
        fetch once and filter client-side. Archived labels are omitted unless `includeArchived`.
      operationId: listLabels
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Include labels retired from use. Default false.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The caller's labels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Label' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /labels/{labelId}:
    patch:
      tags: [labels]
      summary: Rename, reparent, or archive a label
      description: |
        Every field is optional; omitted fields are left alone. Note the distinction on `parentId`:
        **omitting** it leaves the parent unchanged, while sending it as **`null`** moves the label
        to the root.

        Reparenting is **retroactive** — roll-up is derived from the tree as it stands now, so moving
        a label changes past summaries too (ADR-0015). That is intended, and its blast radius is
        confined to the label breakdown: no balance, net worth, per-account spending or income figure
        consults labels. Root-level totals never move; only a subtree's contribution shifts branches.

        The depth limit is checked against the **whole subtree** being moved, not just this label —
        a two-deep subtree cannot move under a label that already sits at level two.

        Archiving retires a label from the picker without disturbing what it was already applied to;
        history still reports under it.
      operationId: updateLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLabelRequest' }
      responses:
        '200':
          description: The updated label.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such label, or no such parent, in the caller's Book. Code `LABEL_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            A sibling already bears the new name (`LABEL_NAME_TAKEN`), the move would put this label
            or any of its descendants past the depth limit (`LABEL_DEPTH_EXCEEDED`), or the move
            would place the label under its own descendant (`LABEL_CYCLE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [labels]
      summary: Delete a label — only if it is unused and childless
      description: |
        Deleting is for tidying, never for destroying history, so it is refused while anything still
        depends on the label (ADR-0015). To retire a label that is in use, **archive** it instead
        (`PATCH`), which keeps history readable while removing it from the picker. To fold one label
        into another, retag its postings first — a deliberate act, rather than a silent side effect
        of pressing delete.
      operationId: deleteLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Label deleted.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such label in the caller's Book. Code `LABEL_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            Postings are still tagged with it (`LABEL_IN_USE`) or it still has children
            (`LABEL_HAS_CHILDREN`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /postings/{postingId}/label:
    put:
      tags: [labels]
      summary: Set (or replace) the label on a posting
      description: |
        A label is metadata attached to a posting, not a field of it — which is why this is a
        sub-resource rather than a patch of the posting (ADR-0014). The posting itself is immutable
        ledger truth and is never rewritten; only this attachment changes.

        A posting may be retagged **at any time, however old it is**. Retagging alters the label
        breakdown and nothing else — net worth, per-account spending and income are byte-identical
        afterwards, because none of them consult labels.

        Only a posting to an **Income or Expense** account can carry a label: it is the leg that
        records money entering or leaving your world. A posting to an Asset, Liability or Equity
        account has nothing to categorize, so it is refused (`LABEL_NOT_APPLICABLE`) rather than
        silently ignored — attempting it almost always means the wrong account kind was chosen.
      operationId: setPostingLabel
      parameters:
        - name: postingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPostingLabelRequest' }
      responses:
        '204':
          description: Label attached.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: |
            No such posting (`POSTING_NOT_FOUND`) or no such label (`LABEL_NOT_FOUND`) in the
            caller's Book.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The posting is not to an Income or Expense account (`LABEL_NOT_APPLICABLE`), or the
            label is archived and cannot be newly applied (`LABEL_ARCHIVED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [labels]
      summary: Clear the label on a posting
      description: |
        Removes the attachment. The posting becomes uncategorized and its amount moves into the
        Uncategorized row of any label breakdown — it never leaves the totals.
      operationId: clearPostingLabel
      parameters:
        - name: postingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Label cleared (also when the posting had none).
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such posting in the caller's Book. Code `POSTING_NOT_FOUND`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/net-worth:
    get:
      tags: [reports]
      summary: Net worth — Assets minus Liabilities, per currency
      description: |
        Computed on demand (ADR-0004): for each currency, total Asset balances minus total Liability
        balances. Money owed TO you is an Asset (a Receivable) so it adds; money you owe is a Liability
        (a Payable) so it subtracts. Valuing across currencies into one figure is out of scope
        (ADR-0002), so the result is broken down per currency.
      operationId: getNetWorth
      responses:
        '200':
          description: Net worth per currency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetWorthReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/spending:
    get:
      tags: [reports]
      summary: Spending over a date range — Expense-account activity, per account, per label, per currency
      description: |
        Sums Expense-account movement over the range (ADR-0004). Transfers, lends, and repayments never
        touch an Expense account, so they are excluded by construction (ADR-0001) — this is only real
        spending. Omit the range for all-time.

        Broken down two ways over the same money: `byAccount` (where it was booked) and `byLabel`
        (what it was for), each totalled per currency. The two are different slices of one
        computation and **must reconcile**: summing `own` across every `byLabel` row — including the
        Uncategorized row — gives the same per-currency figure as `byAccount` and as `totals`.
      operationId: getSpending
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date (ISO 8601). Omit for no lower bound.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive end date (ISO 8601). Omit for no upper bound.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Spending in the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reports/income:
    get:
      tags: [reports]
      summary: Income over a date range — Income-account activity, per account, per label, per currency
      description: |
        Sums Income-account movement over the range (ADR-0004). Like spending, transfers and repayments
        are excluded by construction. Omit the range for all-time.

        Broken down per Income account (`byAccount`) and per label (`byLabel`) — labels apply to
        income just as they do to spending (`salary`, `freelance`, `interest`) — each totalled per
        currency, with the same reconciliation rule as `/reports/spending`.
      operationId: getIncome
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date (ISO 8601). Omit for no lower bound.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive end date (ISO 8601). Omit for no upper bound.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Income in the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityReport' }
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: JSON Web Key Set — the RS256 public key(s) for verifying access tokens
      description: |
        The public key(s) a resource server uses to verify access-token signatures, so no shared
        secret is needed. Public — no authentication. Each key's `kid` matches the `kid` in an
        access token's JWS header.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: The active signing key(s) as a JWKS (RFC 7517).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The short-lived RS256 access token from `/auth/login` or `/auth/refresh`. Validated by
        signature against the JWKS public key; the backend never calls a session store on the
        read path. The refresh token is a separate credential (sent in the body to
        `/auth/refresh`) and is NOT sent here.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Minimum length is provisional; the full policy is a follow-on decision.
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        deviceLabel:
          type: string
          maxLength: 200
          description: |
            Optional label for the Session on the "active devices" screen, e.g. "Pixel 8" or
            "Chrome on Mac". If omitted, the server falls back to the User-Agent. Truncated to 200.
      additionalProperties: false

    RefreshRequest:
      type: object
      required: [refreshToken]
      description: The refresh token to rotate, as returned by login / register / refresh.
      properties:
        refreshToken: { type: string }
      additionalProperties: false

    VerifyEmailRequest:
      type: object
      required: [token]
      description: The single-use verification token from the emailed link.
      properties:
        token: { type: string }
      additionalProperties: false

    PasswordResetRequest:
      type: object
      required: [email]
      description: The email to send a reset link to, if it belongs to a User.
      properties:
        email: { type: string, format: email }
      additionalProperties: false

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The single-use reset token from the emailed link.
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Same policy as registration.
      additionalProperties: false

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken]
      properties:
        accessToken: { type: string, description: RS256 JWT. }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access-token lifetime in seconds (~900). }
        refreshToken:
          type: string
          description: Opaque rotating refresh token. Returned in the body for every client in v1 (see the pre-production hardening note on /auth/login).
      additionalProperties: false

    User:
      type: object
      required: [id, email, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified:
          type: boolean
          description: Whether the User has verified their email. Unverified Users are signed in but cannot share (see the sharing endpoints' 403).
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Session:
      type: object
      required: [id, createdAt, lastActiveAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean, description: True for the Session making this request. }
      additionalProperties: false

    ShareLink:
      type: object
      required: [url, createdAt]
      properties:
        url:
          type: string
          format: uri
          description: The full "anyone with the link" URL, carrying the unguessable token. Re-copyable while active.
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    CreateViewGrantRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Must belong to an already-registered User.
      additionalProperties: false

    ViewGrant:
      type: object
      required: [id, granteeEmail, granteeUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        granteeEmail: { type: string, format: email }
        granteeUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    Jwks:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            description: A JSON Web Key — here an RSA public key (kty=RSA), whose kid matches the token header.
            properties:
              kty: { type: string }
              kid: { type: string }
              alg: { type: string }
              use: { type: string }
              n: { type: string, description: RSA modulus, base64url. }
              e: { type: string, description: RSA exponent, base64url. }

    Money:
      type: object
      description: |
        A monetary amount as a decimal STRING (never a JSON number — a double corrupts it before any
        client reads it) plus an ISO 4217 currency. Posting amounts are non-negative; a balance may
        be negative.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal, up to 4 fractional digits, e.g. "12.34". A balance may be negative, e.g. "-5.00".
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code, e.g. "USD".
      additionalProperties: false

    AccountKind:
      type: string
      description: |
        Fixes the debit/credit normal side and reporting role (ADR-0001). Asset & Expense grow on
        debit; Liability, Income, Equity grow on credit. Net worth = Assets − Liabilities; spending =
        Expense totals; earning = Income totals; Equity is opening capital only.
      enum: [ASSET, LIABILITY, INCOME, EXPENSE, EQUITY]

    CreateAccountRequest:
      type: object
      required: [name, kind, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/AccountKind' }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; every posting to this account is in this currency.
      additionalProperties: false

    Account:
      type: object
      required: [id, name, kind, currency, balance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountKind' }
        currency: { type: string, description: ISO 4217 code. }
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Current balance, computed from postings (ADR-0004). Signed — may be negative.
      additionalProperties: false

    Posting:
      type: object
      description: One leg of a transaction — a debit or credit of a non-negative amount to an account.
      required: [id, accountId, direction, amount]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The posting's stable identity — what a label is attached to, and what
            `/postings/{postingId}/label` addresses.
        accountId: { type: string, format: uuid }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/Money' }
        labelId:
          type: string
          format: uuid
          nullable: true
          description: |
            The label attached to this posting, or null. Only a posting to an Income or Expense
            account can carry one (ADR-0014); on any other posting this is always null. Null on an
            Income/Expense posting means uncategorized, which is a valid state, not missing data.
      additionalProperties: false

    RecordTransactionRequest:
      type: object
      description: |
        A movement — money out of `from` (credited), into `to` (debited). Same-currency: `amount`
        alone. Cross-currency: `amount` is the real figure leaving `from` and `toAmount` the real
        figure arriving in `to`, each in its account's currency (ADR-0002).
      required: [date, time, from, to, amount]
      properties:
        date:
          type: string
          format: date
          description: |
            The calendar date the money moved. This is the only part reporting groups by
            (ADR-0018), so it is the half that must be right even when the time is guessed.
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            The wall-clock time the money moved, as `HH:mm` — 19:42 means 19:42 where the person
            was standing (ADR-0018).

            Deliberately NOT `format: time`: RFC 3339 full-time carries an offset, and an offset
            is precisely what this value must not have. Converting it to any other zone would let
            a late-evening purchase drift into the next day and change which month it reports in.

            Required, because the column is NOT NULL and the server refuses to invent a moment it
            cannot know — it runs in UTC and has no idea what the clock on your wall said. The
            client supplies it from the device, defaulting to now.
        from:
          type: string
          format: uuid
          description: The account money leaves (credited).
        to:
          type: string
          format: uuid
          description: The account money arrives in (debited).
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: The amount leaving `from`, in `from`'s currency.
        toAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            The amount arriving in `to`, in `to`'s currency. Required when the two accounts differ in
            currency; omit it (or match `amount`) when they share one.
        labelId:
          type: string
          format: uuid
          description: |
            Optional. What the money was for. The server attaches it to whichever leg is the Income
            or Expense account — you do not say which posting (ADR-0014).

            Only a transaction with exactly ONE such leg can carry a label. A movement between two
            accounts you own — an internal transfer (Asset→Asset), a debt payment (Asset→Liability),
            an opening balance (Equity→Asset) — has nothing to categorize, and sending a label with
            one is refused (`LABEL_NOT_APPLICABLE`), not ignored: it nearly always means the wrong
            account kind was picked. The mirror case is refused for the opposite reason — an
            Income→Expense movement has TWO legs that could hold a category, and one label cannot say
            which; splits will settle that later. Omit `labelId` to leave the transaction
            uncategorized, which is a valid state.
      additionalProperties: false

    Transaction:
      type: object
      description: A recorded transaction, as its balanced postings (the ledger truth, ADR-0012).
      required: [id, date, time, postings]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Wall-clock `HH:mm`, zoneless — see the note on RecordTransactionRequest.time. Within a
            day this is what orders the ledger (ADR-0018): newest first is
            `date desc, time desc`, with the server's own record-time breaking exact ties.
        exchangeRate:
          type: string
          nullable: true
          description: |
            For a cross-currency transaction, the rate derived from the two legs (to-amount ÷
            from-amount), a decimal string for reference only — never multiplied to make an amount
            (ADR-0002). Null for a same-currency transaction.
        postings:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Posting' }
      additionalProperties: false

    CurrencyNetWorth:
      type: object
      required: [currency, assets, liabilities, netWorth]
      properties:
        currency: { type: string, description: ISO 4217 code. }
        assets:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Total of Asset account balances in this currency.
        liabilities:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Total of Liability account balances in this currency.
        netWorth:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: assets − liabilities (signed).
      additionalProperties: false

    NetWorthReport:
      type: object
      required: [byCurrency]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyNetWorth' }
      additionalProperties: false

    AccountAmount:
      type: object
      required: [accountId, name, currency, amount]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, description: ISO 4217 code. }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    CurrencyAmount:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, description: ISO 4217 code. }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    ActivityReport:
      type: object
      description: |
        Spending or income over a date range, sliced two ways over the same money — by account (where
        it was booked) and by label (what it was for) — and totalled per currency.
      required: [byAccount, byLabel, totals]
      properties:
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        byAccount:
          type: array
          items: { $ref: '#/components/schemas/AccountAmount' }
        byLabel:
          type: array
          description: |
            One row per label per currency, plus a single Uncategorized row (null `labelId`) for
            postings carrying no label. A label appears when EITHER of its figures is non-zero, so a
            parent with no direct spending still shows the total underneath it.
          items: { $ref: '#/components/schemas/LabelAmount' }
        totals:
          type: array
          items: { $ref: '#/components/schemas/CurrencyAmount' }
      additionalProperties: false

    LabelAmount:
      type: object
      description: |
        One label's share of a report, in one currency. A label with postings in several currencies
        appears once per currency.

        Two figures, and the difference matters: `own` counts only postings tagged with THIS label,
        while `rolledUp` adds everything tagged with any of its descendants. Summing `own` across
        rows reproduces `totals`; summing `rolledUp` does NOT — a child's amount appears in its own
        row AND again in every ancestor's row, so adding them double-counts. This failure is silent:
        the number simply comes out too big.
      required: [labelId, name, path, parentLabelId, currency, own, rolledUp]
      properties:
        labelId:
          type: string
          format: uuid
          nullable: true
          description: Null on the single Uncategorized row — the postings carrying no label at all.
        name:
          type: string
          description: The label's own name (`fast food`), or `Uncategorized` on the null-id row.
        path:
          type: string
          description: |
            Full path from the root, for display and disambiguation (`food / restaurants / fast
            food`) — sibling names are unique only within a parent, so the leaf name alone can be
            ambiguous.
        parentLabelId:
          type: string
          format: uuid
          nullable: true
          description: Null for a root label, and for the Uncategorized row.
        currency: { type: string, description: ISO 4217 code. }
        own:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Postings tagged with this label directly. These are the figures that sum to `totals`.
        rolledUp:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            `own` plus every descendant's. Never sum this across rows. Equals `own` on the
            Uncategorized row and on any leaf.
      additionalProperties: false

    Label:
      type: object
      description: |
        A user-defined category — what money was for. One node of a tree at most three levels deep;
        build the tree from `parentId`.
      required: [id, name, path, parentId, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'The label''s own name, as typed (`fast food`).' }
        path:
          type: string
          description: Full path from the root (`food / restaurants / fast food`).
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null for a root label.
        archived:
          type: boolean
          description: |
            Retired from use — hidden from the picker and not offered for new tagging, while
            everything already tagged with it still reports under it.
      additionalProperties: false

    CreateLabelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Unique among its siblings, compared case-insensitively; the casing you send is preserved
            for display.
        parentId:
          type: string
          format: uuid
          description: |
            Omit to create a root label. The parent must itself be at most two levels deep, since
            the tree stops at three.
      additionalProperties: false

    UpdateLabelRequest:
      type: object
      description: |
        Every field is optional and omitted fields are left alone. `parentId` is the one worth
        reading twice: **omitted** leaves the parent unchanged, **explicit null** moves the label to
        the root.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Explicit null moves the label to the root. Omit to leave its parent unchanged.
        archived:
          type: boolean
          description: True retires the label from the picker; false brings it back into use.
      additionalProperties: false

    SetPostingLabelRequest:
      type: object
      required: [labelId]
      properties:
        labelId: { type: string, format: uuid }
      additionalProperties: false

    Problem:
      type: object
      description: RFC 7807 problem detail.
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable code for the specific error. One of: UNAUTHORIZED,
            TOO_MANY_ATTEMPTS, EMAIL_TAKEN, VALIDATION, INVALID_TOKEN, EMAIL_NOT_VERIFIED,
            SESSION_NOT_FOUND, GRANTEE_NOT_FOUND, VIEW_GRANT_EXISTS, VIEW_GRANT_NOT_FOUND,
            CANNOT_SHARE_WITH_SELF, SHARE_LINK_NOT_FOUND, ACCOUNT_NOT_FOUND, TRANSACTION_NOT_FOUND,
            SAME_ACCOUNT, CONVERTED_AMOUNT_REQUIRED.
      additionalProperties: false
